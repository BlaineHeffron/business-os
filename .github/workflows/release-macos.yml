name: Release macOS server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASSET: bos-server-aarch64-apple-darwin.tar.gz
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate the tag input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build the release archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          npm --prefix frontend ci
          npm --prefix frontend run build
          cargo build --locked --release -p bos-server
          target/release/bos-server repo-map >/dev/null

          build_sha="$(git rev-parse HEAD)"
          mkdir -p release/bin
          cp target/release/bos-server release/bin/bos-server
          printf '%s\n' "$build_sha" > release/BUILD_SHA
          chmod 0755 release/bin/bos-server

          tar -czf "$ASSET" -C release bin BUILD_SHA
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          lipo -archs release/bin/bos-server | grep -qw arm64

      - name: Upload the release archive
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
