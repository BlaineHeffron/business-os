name: Contracts TypeScript bindings

on:
  pull_request:
    paths:
      - ".github/workflows/contracts-ts.yml"
      - "crates/bos-contracts/**"
      - "frontend/src/types/generated/**"
      - "justfile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contracts-ts.yml"
      - "crates/bos-contracts/**"
      - "frontend/src/types/generated/**"
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install just
        run: |
          if ! command -v just >/dev/null; then
            cargo install just --locked
          fi

      - name: Compile contracts with ts feature
        run: cargo build -p bos-contracts --features ts

      - name: Regenerate TypeScript bindings
        run: just ts-types

      - name: Verify generated TypeScript is committed
        run: git diff --exit-code -- frontend/src/types/generated
