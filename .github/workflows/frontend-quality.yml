name: Frontend CRAP ratchet

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-quality.yml"
      - ".quality-gates.json"
      - "frontend/**"
      - "scripts/repo-quality*.mjs"
      - "scripts/quality/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-quality.yml"
      - ".quality-gates.json"
      - "frontend/**"
      - "scripts/repo-quality*.mjs"
      - "scripts/quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crap-ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tool versions
        run: |
          node --version
          npm --version
          echo "just=not-used (quality command invokes npm directly)"

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Workflow contract
        run: node --test scripts/quality/frontend-workflow.test.mjs

      - name: CRAP ratchet
        run: npm --prefix frontend run quality:crap
