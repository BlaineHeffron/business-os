<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessOS</title>
    <!-- Apply the saved theme before first paint to avoid a flash. Light is the
         default; only an explicit "dark" preference adds the class. -->
    <script>
      try {
        if (localStorage.getItem("bos-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
